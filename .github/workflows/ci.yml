name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development environment
        run: uv sync --locked --group train --group dev --group medical --group video
      - name: Validate release manifest
        run: uv run python -m json.tool release/final-v1.json >/dev/null
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Check patch whitespace
        run: git diff --check
